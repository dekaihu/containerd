syntax = "proto3";

package containerd.services.rootfsquota.v1;

import weak "gogoproto/gogo.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";

option go_package = "github.com/containerd/containerd/api/services/rootfsquota/v1;rootfsquota";

service RootfsQuota {
    rpc CreateRootfsQuota(CreateRootfsQuotaRequest) returns (CreateRootfsQuotaResponse);
    rpc ListRootfsQuota(ListRootfsQuotaRequest) returns (ListRootfsQuotaResponse);
    rpc UpdateRootfsQuota(UpdateRootfsQuotaRequest) returns (UpdateRootfsQuotaResponse);
    rpc GetRootfsQuota(GetRootfsQuotaRequest) returns (RootfsQuotaInfo);
    rpc DeleteRootfsQuota(DeleteRootfsQuotaRequest) returns (google.protobuf.Empty);
}

message RootfsQuotaInfo {
    string id = 1;               
    string key = 2;               
    string storage = 3;           
    int64 hard_quota = 4;                
    int64 soft_quota = 5;
}

message CreateRootfsQuotaRequest {
    string key = 1;
    string storage = 2;
    int64 soft_quota = 3;
    int64 hard_quota = 4;
    map<string, string> labels = 5;
}

message CreateRootfsQuotaResponse {
    RootfsQuotaInfo rootfsquota_info = 1;
}

message ListRootfsQuotaRequest {
    map<string, string> filters = 1;
    int32 page_size = 2;
    int32 page = 3;
}

message ListRootfsQuotaResponse {
    repeated RootfsQuotaInfo rootfsquota_list = 1;
    int32 total_count = 2;
}

message GetRootfsQuotaRequest {
    string id = 1;
}

message UpdateRootfsQuotaRequest {
    string id = 1;
    RootfsQuotaInfo rootfsquota_info = 2;
    google.protobuf.FieldMask update_mask = 3;
}

message UpdateRootfsQuotaResponse {
    RootfsQuotaInfo rootfsquota_info = 1;
}

message DeleteRootfsQuotaRequest {
    string id = 1;
}